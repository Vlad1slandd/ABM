<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Скругленный фон под иконку клиники -->
  <rect width="400" height="400" rx="90" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Стилизованный анатомический зуб -->
  <path d="M200 80C155 80 120 102 105 140C90 178 98 228 112 268C122 296 142 335 168 335C184 335 188 305 200 305C212 305 216 335 232 335C258 335 278 296 288 268C302 228 310 178 295 140C280 102 245 80 200 80Z" fill="url(#toothGrad)"/>

  <!-- Линия эстетики улыбки -->
  <path d="M148 140C148 126 170 114 200 114C230 114 252 126 252 140" stroke="#0284C7" stroke-width="12" stroke-linecap="round"/>

  <!-- Искорки белизны и чистоты -->
  <circle cx="260" cy="100" r="14" fill="#38BDF8"/>
  <circle cx="135" cy="118" r="8" fill="#38BDF8"/>

  <!-- Текст ABM -->
  <text x="200" y="235" font-family="'Inter', sans-serif" font-size="44" font-weight="900" fill="#0284C7" text-anchor="middle" letter-spacing="4">ABM</text>
  <text x="200" y="260" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">DENTAL CLINIC</text>
</svg>
